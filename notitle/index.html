<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgeVision AI - Universal Detector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>AgeVision <span>AI</span></h1>
        <p class="subtitle">Scan via Webcam or Upload any image to analyze generation</p>

        <!-- Control Dashboard -->
        <div class="control-panel">
            <button class="btn btn-primary" type="button" onclick="initWebcam()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 7l-7 5 7 5V7z" />
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                </svg>
                Start Webcam
            </button>

            <div class="upload-btn-wrapper">
                <button class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    Upload Image
                </button>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
        </div>

        <!-- Display Viewport -->
        <div class="view-matrix">
            <div id="webcam-container" class="display-box" style="display:none;"></div>
            <div id="image-container" class="display-box" style="display:none;">
                <img id="imagePreview" src="#" alt="Analysis Target">
            </div>
            <div id="placeholder-box" class="display-box">
                <span class="placeholder-text">Camera inactive / No image uploaded</span>
            </div>
        </div>

        <!-- Analytics Output -->
        <div id="label-container"></div>
    </div>

    <!-- External TensorFlow & Teachable Machine APIs -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <!-- Custom Application Logic -->
    <script src="script.js"></script>
</body>

</html>
