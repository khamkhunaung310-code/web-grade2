<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9PM Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- header -->
    <header>
        <h1>9PM Cafe</h1>


        <nav>
            <a href="#about">About</a>
            <a href="#menu">Menu</a>
            <a href="#access">Access</a>
        </nav>


        <button>Theme change</button>
    </header>

    <!-- main -->
    <main>

        <!-- hero -->
        <section id="hero">
            <h2>The morning light and a cup of coffee.</h2>
            <p>A neighborhood cafe offering a peaceful time.</p>
        </section>

        <!-- about -->
        <section id="about">
            <h2>About</h2>
            <p>2026年オープン。豆の香りと木の温もりに包まれた小さな空間で、ゆったりとした時間をお過ごしいただけます。
               お一人でも、ご家族でも、お気軽にどうぞ。</p>

        </section>

        <!-- menu -->
        <section id="menu">
            <h2>Menu</h2>

            <div class="recommend">
                <h3>今日のおすすめは？</h3>
                <p>気分が決まらないときは、おまかせで一品ご提案します。</p>
                <button onclick="pickRecommend()" class="recommend-btn">☕ おすすめを見る</button>

            </div>

        </section>
    </main>

    <!-- footer -->
    <footer>

    </footer>


</body>

</html>
