<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linguist | Multi-Language Translator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Linguist<span>Pro</span></h1>
            <p>Translate across the globe in seconds.</p>
        </header>

        <div class="translator-box">
            <div class="controls">
                <select id="src-lang-select">
                    <option value="en">English</option>
                    <option value="ja" selected>Japanese</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ko">Korean</option>
                    <option value="it">Italian</option>
                    <option value="ru">Russian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="vi">Vietnamese</option>
                    <option value="th">Thai</option>
                </select>

                <button id="swap-btn"><i class="fas fa-exchange-alt"></i></button>

                <select id="tgt-lang-select">
                    <option value="en" selected>English</option>
                    <option value="ja">Japanese</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ko">Korean</option>
                    <option value="it">Italian</option>
                    <option value="ru">Russian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="vi">Vietnamese</option>
                    <option value="th">Thai</option>
                </select>
            </div>

            <div class="text-areas">
                <div class="input-container">
                    <textarea id="source-text" placeholder="Type something..."></textarea>
                    <div class="char-count">0 / 500</div>
                </div>
                <div class="output-container">
                    <div id="target-text" class="placeholder">Translation will appear here...</div>
                    <button id="copy-btn" title="Copy to clipboard"><i class="far fa-copy"></i></button>
                </div>
            </div>

            <button id="translate-btn">Translate Now</button>
        </div>

        <footer>
            <p>&copy; 2026 Linguist Pro. Powered by MyMemory API.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
