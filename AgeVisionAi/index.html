<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgeVision AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>AgeVision <span>AI</span></h1>

        <button class="btn-start" type="button" onclick="init()">Start Camera</button>

        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/gncJniqHV/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(200, 200, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);

            // Progress Bar Layout များ ဖန်တီးခြင်း
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // Clear existing
            for (let i = 0; i < maxPredictions; i++) {
                let row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = `
                    <div class="label-text">
                        <span class="class-name">Loading...</span>
                        <span class="class-percentage">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"></div>
                    </div>
                `;
                labelContainer.appendChild(row);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = (prediction[i].probability * 100).toFixed(0); // ရာခိုင်နှုန်းပြောင်းခြင်း

                // UI Elements များကို ယူပြီး Update လုပ်ခြင်း
                const row = labelContainer.childNodes[i];
                row.querySelector(".class-name").innerText = className;
                row.querySelector(".class-percentage").innerText = probability + "%";
                row.querySelector(".progress-bar-fill").style.width = probability + "%";
            }
        }
    </script>

</body>

</html>
